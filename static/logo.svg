<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Container with modern cyber curvature -->
  <path d="M32 4 L54 12 C54 36 43 51 32 60 C21 51 10 36 10 12 Z" 
        fill="url(#shieldBg)" 
        stroke="#60a5fa" 
        stroke-width="1.5" 
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Inner High-Tech Shield Border -->
  <path d="M32 9 L49 15 C49 34 40 46 32 54 C24 46 15 34 15 15 Z" 
        fill="none" 
        stroke="#93c5fd" 
        stroke-width="1" 
        stroke-opacity="0.4" 
        stroke-dasharray="3 2" />

  <!-- AI Circuit / Detection Nodes -->
  <line x1="32" y1="17" x2="32" y2="25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="17" r="2.5" fill="#38bdf8" />
  
  <line x1="22" y1="25" x2="28" y2="27" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="22" cy="25" r="2" fill="#60a5fa" />
  
  <line x1="42" y1="25" x2="36" y2="27" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="42" cy="25" r="2" fill="#60a5fa" />

  <!-- Bold Verification Checkmark / Security Emblem -->
  <path d="M22 34 L29 41 L43 25" 
        fill="none" 
        stroke="url(#accentGlow)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Cyber pulse accent -->
  <circle cx="43" cy="25" r="2" fill="#ffffff" />
</svg>